<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pedidos</title>
    <link rel="stylesheet" th:href="@{/css/bat-theme.css}" href="/css/bat-theme.css">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<main class="page-shell">
    <datalist id="listaAlunos">
        <option th:each="aluno : ${alunos}" 
        th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}">
    </option>
    </datalist>

    <datalist id="listaProdutos">
        <option th:each="produto : ${produtos}" 
        th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
        th:attr="data-preco=${produto.valorProduto}">
        </option>
    </datalist>

    <section class="hero">
        <span class="eyebrow">Pedidos</span>
        <h1>Novo pedido</h1>
        <p>Selecione o aluno e adicione os produtos desejados.</p>
        <div class="form-actions"><a class="btn btn-secondary" th:href="@{/home}">Voltar ao início</a></div>
    </section>

    <section class="form-card" style="margin-top: 28px;">
        <div class="form-grid">
            <div class="field field-full">
                <label for="aluno">Aluno</label>
                <input list="listaAlunos" id="aluno" type="text" placeholder="Digite o nome do aluno">
            </div>
            <div class="field">
                <label for="produto">Produto</label>
                <input list="listaProdutos" id="produto" type="text" placeholder="Digite o produto">
            </div>
            <div class="field">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" placeholder="0" min="1">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="button" onclick="adicionarItem()">Adicionar produto</button>
        </div>
    </section>

    <!-- Tabela de produtos adicionados -->

    <section class="table-card" style="margin-top: 28px;">
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço Unitário</th>
                <th>Subtotal</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-itens">
            <tr id="empty-row">
                <td colspan="5" style="text-align: center;">Nenhum item adicionado ao pedido</td>
            </tr>
        </tbody>
    </table>
    <div class="order-total">
        <span>Total do pedido</span>
        <strong>R$ <span id="totalPedido">0,00</span></strong>
    </div>
    <div class="form-actions">
        <button class="btn btn-primary" type="button" onclick="salvarPedido()">Confirmar e salvar pedido</button>
    </div>
    </section>

        <script>
        let itens = [];
 
        function adicionarItem() {
            let produtoInput = document.getElementById("produto").value;
            let quantidade = document.getElementById("quantidade").value;
 
            if (!produtoInput || quantidade <= 0) {
                alert("Preencha corretamente o produto e a quantidade!");
                return;
            }
 
            let partes = produtoInput.split(" - ");
            let produtoId = partes[0];
            let produtoNome = partes[1];
 
            let options = document.querySelectorAll("#listaProdutos option");
            let preco = null;
 
            options.forEach(opt => {
                if (opt.value === produtoInput) {
                    preco = opt.getAttribute("data-preco");
                }
            });
 
            if (!preco) {
                alert("Produto inválido! Selecione um produto da lista.");
                return;
            }
 
            let subtotal = quantidade * preco;
 
            itens.push({
                produto: { idProduto: produtoId },
                nomeProduto: produtoNome,
                quantidade: parseInt(quantidade),
                preco: parseFloat(preco),
                subtotal: subtotal
            });
 
            document.getElementById("produto").value = "";
            document.getElementById("quantidade").value = "";
 
            renderTabela();
        }
 
        function removerItem(index) {
            itens.splice(index, 1);
            renderTabela();
        }
 
        function renderTabela() {
            let tabela = document.getElementById("tabela-itens");
            tabela.innerHTML = "";
 
            if (itens.length === 0) {
                tabela.innerHTML = `<tr class="empty-row" id="empty-row"><td colspan="5">Nenhum produto adicionado ao pedido.</td></tr>`;
                document.getElementById("totalPedido").innerText = "0,00";
                return;
            }
 
            let total = 0;
 
            itens.forEach((item, index) => {
                total += item.subtotal;
                tabela.innerHTML += `
<tr>
<td>${item.nomeProduto}</td>
<td>${item.quantidade}</td>
<td>R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
<td>R$ ${item.subtotal.toFixed(2).replace('.', ',')}</td>
<td><button class="btn btn-danger" onclick="removerItem(${index})">Remover</button></td>
</tr>
                `;
            });
 
            document.getElementById("totalPedido").innerText = total.toFixed(2).replace('.', ',');
        }
 
        function salvarPedido() {
            let alunoInput = document.getElementById("aluno").value;
 
            if (!alunoInput) {
                alert("Selecione um aluno antes de salvar!");
                return;
            }
 
            if (itens.length === 0) {
                alert("Adicione ao menos um produto ao pedido!");
                return;
            }
 
            let alunoId = alunoInput.split(" - ")[0];
 
            let pedido = {
                aluno: { idAluno: alunoId },
                itens: itens
            };

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
            const headers = { "Content-Type": "application/json" };
            headers[csrfHeader] = csrfToken;

            fetch("/pedidos/salvar", {
                method: "POST",
                headers: headers,
                body: JSON.stringify(pedido)
            })
            .then(res => {
                if (!res.ok) throw new Error("Erro HTTP " + res.status);
                alert("Pedido salvo com sucesso!");
                window.location.href = "/pedidos/listar";
            })
            .catch(err => {
                alert("Erro ao salvar o pedido. Tente novamente.");
                console.error(err);
            });
        }
</script>
</main>
</body>
</html>
